# CS 1.6 panel — multi-tenant PHP website host.
# Each game server's site lives in /var/www/html/servers/<port>/ and is
# reachable as:
#   http://<php-host>/<port>/               (path based, always available)
#   http://php-<port>.<your-domain>/        (wildcard DNS → this container)
#   http://<custom-domain>/                 (domains.map, managed by the panel)
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/servers

    # The panel session cookie must never reach customer PHP code (panel and
    # PHP host may share a hostname with a different port, or a parent domain).
    RequestHeader edit* Cookie "(^|;\s*)cs_panel_session=[^;]*" ""
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    RewriteEngine On
    RewriteMap lc int:tolower
    RewriteMap paneldomains "txt:/var/www/html/.panel/domains.map"

    # php-<port>.example.com → site root of that server
    RewriteCond %{HTTP_HOST} ^php-(\d+)\. [NC]
    RewriteRule ^/(.*)$ /var/www/html/servers/%1/$1 [L,DPI]

    # Custom domains assigned in the panel
    RewriteCond ${paneldomains:${lc:%{HTTP_HOST}}|NONE} ^(\d+)$
    RewriteRule ^/(.*)$ /var/www/html/servers/%1/$1 [L,DPI]

    RedirectMatch 404 ^/$

    <Directory />
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/servers>
        # FileInfo (mod_rewrite, ErrorDocument), AuthConfig and Limit are what
        # common CMS .htaccess files need. "Options" is deliberately NOT
        # overridable: it would allow php_value to replace the isolation prepend.
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride FileInfo AuthConfig Limit Indexes
        DirectoryIndex index.php index.html index.htm
        Require all granted
    </Directory>

    <FilesMatch "^\.(ht|git|env)">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
