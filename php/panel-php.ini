; CS 1.6 panel — shared PHP hosting hardening
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Per-site isolation (open_basedir, sessions) is applied by this prepend file.
auto_prepend_file = /usr/local/etc/php/panel-prepend.php
; .user.ini files could otherwise replace auto_prepend_file / open_basedir.
user_ini.filename =

allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,pcntl_signal,dl,symlink,link,putenv,proc_nice,proc_terminate,proc_get_status,posix_kill,posix_setuid,posix_setgid,posix_setsid,posix_mkfifo,apache_setenv,virtual,ini_alter,ini_restore

memory_limit = 128M
max_execution_time = 30
max_input_time = 60
upload_max_filesize = 32M
post_max_size = 34M
max_file_uploads = 20

session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
