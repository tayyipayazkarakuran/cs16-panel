server {
    listen 80;
    server_name _;

    root /var/www/fastdl;
    server_tokens off;

    # Directory listings exposed every server's file tree; clients never need them.
    autoindex off;

    access_log /var/log/nginx/fastdl_access.log;
    error_log  /var/log/nginx/fastdl_error.log;

    # Never serve hidden files, temporary copies or anything that can hold secrets.
    location ~ /\. { return 404; }
    location ~* \.(cfg|ini|sma|amxx|log|so|dll|sq3|vault|json|php|cspanel-tmp)$ { return 404; }

    # GoldSrc client asset types only.
    location ~* \.(bsp|wad|mdl|spr|wav|mp3|tga|res|txt|bmp)$ {
        access_log off;
        default_type application/octet-stream;
        # Revalidate overwritten assets quickly while retaining browser/CDN cache.
        add_header Cache-Control "public, max-age=300, must-revalidate";
        sendfile on;
        tcp_nopush on;
        try_files $uri =404;
    }

    location = / { return 200 "FastDL\n"; default_type text/plain; }
    location / { return 404; }

    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain;
}
