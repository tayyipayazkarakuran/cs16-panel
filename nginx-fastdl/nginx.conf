server {
    listen 80;
    server_name _;

    root /var/www/fastdl;

    # Directory listing for debugging
    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        default_type application/octet-stream;
    }

    # Serve all CS 1.6 file types efficiently
    location ~* \.(bsp|wad|mdl|spr|wav|mp3|tga|res|txt|cfg|bmp)$ {
        access_log off;
        # Revalidate overwritten assets quickly while retaining browser/CDN cache.
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
        error_page 404 = @empty404;
    }

    location @empty404 {
        return 404 "";
    }

    # gzip for faster downloads where applicable
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/xml application/xml;

    # Large file support
    client_max_body_size 500m;

    access_log /var/log/nginx/fastdl_access.log;
    error_log  /var/log/nginx/fastdl_error.log;
}
